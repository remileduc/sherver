name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats
          sudo apt-get clean
          shellcheck --version
          bats --version

      # not committed (see .gitignore), and the generated documentation check
      # skips silently without it.
      - name: Install tomdoc.sh
        run: |
          wget https://raw.githubusercontent.com/mlafeldt/tomdoc.sh/refs/heads/master/tomdoc.sh
          chmod +x tomdoc.sh
          ./tomdoc.sh --version

      - name: Lint
        run: ./tests/lint.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats socat gettext-base
          sudo apt-get clean
          echo 'bats version:'
          bats --version
          echo 'socat version:'
          socat -V

      - name: Run tests
        run: bats --print-output-on-failure tests/
